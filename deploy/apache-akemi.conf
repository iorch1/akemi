# Akemi — app educativa en https://cloud.akhio.com/akemi/
#
# Instalacion (una vez, con sudo):
#   sudo bash /home/akhio/akemi-web/deploy/enable-akemi-cloud.sh
#
# Si HTML responde 200 pero /akemi/assets/* da 403: permisos en dist/assets/
# (chmod 755 dirs, 644 files) y SELinux restorecon en dist/.

RedirectMatch ^/akemi$ /akemi/

Alias /akemi /home/akhio/akemi-web/dist

<Directory "/home/akhio/akemi-web/dist">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    FallbackResource /akemi/index.html
</Directory>

<Directory "/home/akhio/akemi-web/dist/assets">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>