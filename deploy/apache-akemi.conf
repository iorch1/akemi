# Akemi — app educativa en https://cloud.akhio.com/akemi/
#
# Instalacion (una vez, con sudo):
#   sudo cp /home/akhio/akemi-web/deploy/apache-akemi.conf /etc/httpd/conf.d/akemi.conf
#   sudo chcon -R -t httpd_sys_content_t /home/akhio/akemi-web/dist
#   sudo httpd -t
#   sudo systemctl reload httpd

RedirectMatch ^/akemi$ /akemi/

Alias /akemi /home/akhio/akemi-web/dist

<Directory "/home/akhio/akemi-web/dist">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    FallbackResource /akemi/index.html
</Directory>